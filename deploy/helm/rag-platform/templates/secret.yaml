{{- if not .Values.secrets.existingSecret }}
{{- $values := deepCopy .Values.secrets.values }}
{{- if .Values.backingServices.enabled }}
{{- $password := required "backingServices.devPassword is required when backingServices.enabled is true" .Values.backingServices.devPassword }}
{{- $fullname := include "rag.fullname" . }}
{{- if include "rag.backing" (dict "root" . "name" "postgres") }}
{{- $_ := set $values "RAG_POSTGRES_DSN" (default (printf "postgresql://rag:%s@%s-postgres:5432/rag" $password $fullname) (get $values "RAG_POSTGRES_DSN")) }}
{{- end }}
{{- if include "rag.backing" (dict "root" . "name" "redis") }}
{{- $_ := set $values "RAG_REDIS_URL" (default (printf "redis://%s-redis:6379/0" $fullname) (get $values "RAG_REDIS_URL")) }}
{{- end }}
{{- if include "rag.backing" (dict "root" . "name" "neo4j") }}
{{- $_ := set $values "RAG_NEO4J_PASSWORD" (default $password (get $values "RAG_NEO4J_PASSWORD")) }}
{{- end }}
{{- if include "rag.backing" (dict "root" . "name" "minio") }}
{{- $_ := set $values "RAG_MINIO_ACCESS_KEY" (default "rag" (get $values "RAG_MINIO_ACCESS_KEY")) }}
{{- $_ := set $values "RAG_MINIO_SECRET_KEY" (default $password (get $values "RAG_MINIO_SECRET_KEY")) }}
{{- end }}
{{- end }}
{{- if $values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag.fullname" . }}-secrets
  labels:
    {{- include "rag.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
