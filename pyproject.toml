[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "self-optimizing-rag-platform"
version = "0.3.0"
description = "Evaluation-driven, privacy-aware RAG platform starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "pydantic>=2.11,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.17,<3.0",
  "pytest>=8.4,<10.0",
  "pytest-cov>=6.2,<8.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
rag-platform = "rag_platform.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_platform = ["static/*.html"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]
markers = [
  "integration: tests exercising the HTTP application boundary",
]

[tool.coverage.run]
branch = true
source = ["rag_platform"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rag_platform"]

