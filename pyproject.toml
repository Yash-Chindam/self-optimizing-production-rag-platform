[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "self-optimizing-rag-platform"
version = "0.11.0"
description = "Evaluation-driven, privacy-aware RAG platform starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "pydantic>=2.11,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.17,<3.0",
  "pytest>=8.4,<10.0",
  "pytest-cov>=6.2,<8.0",
  "ruff>=0.12,<1.0",
]
# Production store adapters (specification sections 5, 6 and 18). Optional on purpose: the
# deterministic in-process implementations remain the default, so the demo and the unit suite
# install nothing heavy.
stores = [
  "qdrant-client>=1.12,<2.0",
  "opensearch-py>=2.7,<4.0",
  "neo4j>=5.25,<7.0",
  "psycopg[binary]>=3.2,<4.0",
  "minio>=7.2,<8.0",
  "redis>=5.2,<9.0",
]
embeddings = [
  "sentence-transformers>=3.0,<6.0",
]
# Presidio runs in-process, inside the trusted boundary. It also needs a spaCy model:
#   python -m spacy download en_core_web_sm
privacy = [
  "presidio-analyzer>=2.2,<3.0",
]
llm = [
  "dspy>=3.0,<4.0",
]
# LangGraph as the query workflow executor.
workflow = [
  "langgraph>=1.0,<2.0",
]
# LlamaIndex parsers and transformations for ingestion.
ingestion = [
  "llama-index-core>=0.12,<1.0",
]
# Optional Kafka transport for source-change, ingestion and evaluation events.
events = [
  "confluent-kafka>=2.6,<3.0",
]
# Prefect flows for ingestion, evaluation and optimization.
orchestration = [
  "prefect>=3.4,<4.0",
]
# RAGAS and DeepEval, used with reference-based metrics only. RAGAS 0.4 still imports a module
# that langchain-community 0.4 removed, hence the upper bound.
evaluation = [
  "ragas>=0.4,<0.5",
  "langchain-community>=0.3,<0.4",
  "deepeval>=3.0,<5.0",
]
# OpenTelemetry tracing in OpenInference conventions, exported over OTLP to a collector.
observability = [
  "opentelemetry-sdk>=1.30,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
  "openinference-semantic-conventions>=0.1.12,<1.0",
]
# Experiment governance: MLflow tracking and registry, and DVC for the evaluation set.
governance = [
  "mlflow-skinny>=3.0,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "dvc[s3]>=3.50,<4.0",
]

[project.scripts]
rag-platform = "rag_platform.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_platform = ["static/*.html"]

[tool.pytest.ini_options]
# DeepEval ships a pytest plugin that reports every skip; it is not used here.
addopts = "--strict-config --strict-markers -q -p no:deepeval"
testpaths = ["tests"]
markers = [
  "integration: tests exercising the HTTP application boundary",
]

[tool.coverage.run]
branch = true
source = ["rag_platform"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rag_platform"]

# Optional store clients ship no stubs, and they are absent entirely unless the matching extra
# is installed. Type checking the adapters still covers everything on our side of the boundary.
[[tool.mypy.overrides]]
module = [
  "qdrant_client.*",
  "opensearchpy.*",
  "sentence_transformers.*",
  "neo4j.*",
  "psycopg.*",
  "minio.*",
  "redis.*",
  "mlflow.*",
  "opentelemetry.*",
  "openinference.*",
]
ignore_missing_imports = true

# These arrive transitively with the store extras. Their own stubs target a newer Python than
# the 3.11 floor this project type checks against, and checking inside them proves nothing
# about this codebase.
[[tool.mypy.overrides]]
module = [
  "numpy",
  "numpy.*",
  "grpc",
  "grpc.*",
  "dspy",
  "dspy.*",
  "presidio_analyzer",
  "presidio_analyzer.*",
  "deprecated",
  "deprecated.*",
  "langgraph",
  "langgraph.*",
  "langchain_core",
  "langchain_core.*",
  "llama_index",
  "llama_index.*",
  "confluent_kafka",
  "confluent_kafka.*",
  "deepeval",
  "deepeval.*",
  "ragas",
  "ragas.*",
  "prefect",
  "prefect.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true


# Prefect's task and flow decorators are untyped once prefect itself is skipped above; the
# functions they wrap are still fully annotated and checked.
[[tool.mypy.overrides]]
module = ["rag_platform.adapters.prefect_flows"]
disallow_untyped_decorators = false
