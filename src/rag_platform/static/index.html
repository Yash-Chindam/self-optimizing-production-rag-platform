<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Evidence Console</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; background: #08111f; color: #e7edf7; }
      main { width: min(760px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0; }
      .eyebrow { color: #72e4c2; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { max-width: 620px; font-size: clamp(2.3rem, 6vw, 4.5rem); line-height: .98; margin: 16px 0; }
      .lede { color: #9eb0c8; line-height: 1.7; max-width: 620px; }
      form, .result { margin-top: 32px; padding: 24px; border: 1px solid #26364d; border-radius: 18px; background: #0d1a2b; }
      label { display: block; margin-bottom: 10px; font-weight: 650; }
      textarea { box-sizing: border-box; width: 100%; min-height: 112px; resize: vertical; border: 1px solid #3a4c65; border-radius: 12px; padding: 14px; background: #08111f; color: inherit; font: inherit; }
      button { margin-top: 14px; border: 0; border-radius: 999px; padding: 12px 20px; background: #72e4c2; color: #07120f; font-weight: 800; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      .result[hidden] { display: none; }
      .status { color: #72e4c2; font-size: .85rem; font-weight: 750; text-transform: uppercase; }
      .answer { line-height: 1.7; }
      a { color: #8cc8ff; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Tenant-aware RAG</div>
      <h1>Answers that show their evidence.</h1>
      <p class="lede">This first production slice applies tenant and access filters before hybrid retrieval. It answers only when authorized evidence exists.</p>
      <form id="query-form">
        <label for="question">Ask the ACME employee handbook</label>
        <textarea id="question" required minlength="2">How do I request annual leave?</textarea>
        <button id="submit" type="submit">Find evidence</button>
      </form>
      <section class="result" id="result" aria-live="polite" hidden>
        <div class="status" id="status"></div>
        <p class="answer" id="answer"></p>
        <div id="citations"></div>
      </section>
    </main>
    <script>
      const form = document.querySelector('#query-form');
      const submit = document.querySelector('#submit');
      const result = document.querySelector('#result');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        submit.disabled = true;
        result.hidden = false;
        document.querySelector('#status').textContent = 'Searching';
        document.querySelector('#answer').textContent = '';
        document.querySelector('#citations').replaceChildren();
        try {
          const response = await fetch('/v1/query', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Tenant-ID': 'tenant-acme',
              'X-Access-Labels': 'employees',
            },
            body: JSON.stringify({ question: document.querySelector('#question').value }),
          });
          if (!response.ok) throw new Error(`Query failed (${response.status})`);
          const payload = await response.json();
          document.querySelector('#status').textContent = payload.status.replace('_', ' ');
          document.querySelector('#answer').textContent = payload.answer;
          const citations = document.querySelector('#citations');
          for (const citation of payload.citations) {
            const link = document.createElement('a');
            link.href = citation.source_uri;
            link.textContent = `[${citation.citation_id}] ${citation.source_title}`;
            citations.append(link);
          }
        } catch (error) {
          document.querySelector('#status').textContent = 'error';
          document.querySelector('#answer').textContent = error.message;
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
