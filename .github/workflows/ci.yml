name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        # The store extras are installed so the adapters are type checked against the real
        # client types and their unit tests count toward coverage.
        run: python -m pip install -e ".[dev,stores]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Unit and integration tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install application and browser dependencies
        run: |
          python -m pip install .
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  stores:
    name: Store adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install with the store extras
        run: python -m pip install -e ".[dev,stores]"
      - name: Start the store stack from docker-compose.yml
        run: docker compose up -d --wait --wait-timeout 300
      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" >&2
          exit 1
      - name: Adapter tests against the real stores
        # Coverage is gated in the `python` job; this one is about the wire protocols.
        run: |
          set -a && . deploy/local.env && set +a
          pytest tests/integration/test_stores.py tests/integration/test_services.py -v --no-cov
      - name: Store logs
        if: failure()
        run: docker compose logs --tail 80

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: rag-platform:ci
      - name: Validate the local store stack
        run: docker compose config --quiet
