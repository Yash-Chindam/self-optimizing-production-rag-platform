name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        # Every optional extra is installed so the adapters are type checked against the real
        # client types and their unit tests count toward coverage.
        run: |
          python -m pip install -e ".[dev,stores,privacy,llm,observability,governance,workflow,ingestion,events,orchestration,evaluation]"
          python -m spacy download en_core_web_sm
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Unit and integration tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Evaluation gate, reproduced from the versioned dataset
        # Reruns the DVC stage and fails if the release gate fails, or if what the platform
        # answers for the committed dataset no longer matches the committed dvc.lock.
        run: |
          dvc repro --force evaluate
          git diff --exit-code dvc.lock reports/evaluation/metrics.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install application and browser dependencies
        run: |
          python -m pip install .
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  stores:
    name: Store adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install with the store extras
        run: python -m pip install -e ".[dev,stores,observability,governance,events,orchestration,evaluation]"
      - name: Start the store stack from docker-compose.yml
        run: docker compose up -d --wait --wait-timeout 300
      - name: Wait for the services without a container health check
        run: |
          wait_for() {
            for _ in $(seq 1 45); do
              curl -fsS "$1" >/dev/null && return 0
              sleep 2
            done
            echo "$1 did not become ready" >&2
            return 1
          }
          wait_for http://127.0.0.1:6333/readyz
          wait_for http://127.0.0.1:9000/minio/health/live
          wait_for http://127.0.0.1:6006/healthz
          wait_for http://127.0.0.1:13133/
          wait_for http://127.0.0.1:5000/health
          wait_for http://127.0.0.1:4200/api/health
      - name: Adapter tests against the real stores
        # Coverage is gated in the `python` job; this one is about the wire protocols.
        run: |
          set -a && . deploy/local.env && set +a
          pytest tests/integration/test_stores.py tests/integration/test_services.py             tests/integration/test_observability.py tests/integration/test_kafka.py \
            tests/integration/test_orchestration.py \
            tests/integration/test_full_stack.py \
            -v --no-cov
      - name: DVC round trip through the object store
        # Evaluation outputs are pushed to MinIO, dropped locally, and pulled back by hash.
        run: |
          set -a && . deploy/local.env && set +a
          python deploy/ensure_bucket.py rag-dvc
          dvc repro evaluate
          dvc push
          rm -rf .dvc/cache reports/evaluation/results.jsonl
          dvc pull
          test -s reports/evaluation/results.jsonl
          dvc status --cloud
      - name: Store logs
        if: failure()
        run: docker compose logs --tail 80

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: rag-platform:ci
      - name: Build the image a store-backed deployment runs
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: rag-platform:ci-stores
          build-args: |
            RAG_EXTRAS=stores,observability,events,workflow
      - name: Validate the local store stack
        run: docker compose config --quiet

  kubernetes:
    name: Helm chart on Kubernetes
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/rag-platform
    steps:
      - uses: actions/checkout@v7
      - name: Lint the chart with default and development values
        run: |
          helm lint "$CHART" --strict
          helm lint "$CHART" --strict -f "$CHART/values-dev.yaml"
      - name: Refuse in-cluster stores without an explicit development password
        run: |
          if helm template rag "$CHART" --set backingServices.enabled=true > /dev/null 2>&1; then
            echo "backingServices rendered without devPassword" >&2
            exit 1
          fi
      - name: Create a cluster and load the application image
        run: |
          kind create cluster --wait 120s
          docker build -t rag-platform:ci .
          kind load docker-image rag-platform:ci
      - name: Validate every manifest of the full topology against the API server
        run: |
          helm template rag "$CHART" -f "$CHART/values-dev.yaml" --set image.tag=ci \
            | kubectl apply --dry-run=server -f -
      - name: Install the chart and wait for the rollout
        run: |
          helm install rag "$CHART" --set image.tag=ci --wait --timeout 300s
          kubectl get pods,svc,hpa,pdb,networkpolicy
      - name: Run the chart's own test against the running API
        run: |
          helm test rag --logs
      - name: Cluster state
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods | tail -80
          kubectl logs -l app.kubernetes.io/component=api --tail 80 || true
