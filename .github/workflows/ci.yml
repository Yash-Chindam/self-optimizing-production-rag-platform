name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Unit and integration tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install application and browser dependencies
        run: |
          python -m pip install .
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  stores:
    name: Store adapters
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
      opensearch:
        image: opensearchproject/opensearch:2.18.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install with the store extras
        run: python -m pip install -e ".[dev,stores]"
      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" >&2
          exit 1
      - name: Adapter tests against real Qdrant and OpenSearch
        env:
          RAG_QDRANT_URL: http://127.0.0.1:6333
          RAG_OPENSEARCH_URL: http://127.0.0.1:9200
        # Coverage is gated in the `python` job; this one is about the wire protocol.
        run: pytest tests/integration/test_stores.py -v --no-cov

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: rag-platform:ci
      - name: Validate the local store stack
        run: docker compose config --quiet
