name: Merge after CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge successful trusted pull requests
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            for (const candidate of context.payload.workflow_run.pull_requests) {
              const { data: pull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: candidate.number,
              });
              const trustedAuthor = pull.user.login === owner || pull.user.login === 'dependabot[bot]';
              const targetsDefaultBranch = pull.base.ref === context.payload.repository.default_branch;
              if (!pull.draft && trustedAuthor && targetsDefaultBranch) {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pull.number,
                  merge_method: 'merge',
                });
              }
            }
