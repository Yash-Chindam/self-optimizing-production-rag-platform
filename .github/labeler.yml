"area: api":
  - changed-files:
      - any-glob-to-any-file: "src/rag_platform/**"

"area: ui":
  - changed-files:
      - any-glob-to-any-file: "src/rag_platform/static/**"

"tests: unit":
  - changed-files:
      - any-glob-to-any-file: "tests/unit/**"

"tests: integration":
  - changed-files:
      - any-glob-to-any-file: "tests/integration/**"

"tests: e2e":
  - changed-files:
