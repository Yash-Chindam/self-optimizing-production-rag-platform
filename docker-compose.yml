# Local stack for the stores in specification sections 5, 6 and 18.
#
# The application does not need any of this to run: `python -m rag_platform` uses the in-process
# implementations. Bring these up to exercise the real adapters:
#
#   docker compose up -d qdrant opensearch
#   RAG_QDRANT_URL=http://127.0.0.1:6333 RAG_OPENSEARCH_URL=http://127.0.0.1:9200 \
#     pytest tests/integration/test_stores.py
#
# Single-node, no-auth, ephemeral settings here are for local development only; the Helm chart
# under deploy/ is what carries production configuration.

name: rag-platform

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has no shell utilities, so probe from Qdrant's own entrypoint binary.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  neo4j:
    image: neo4j:5.26-community
    environment:
      - NEO4J_AUTH=neo4j/local-dev-only
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p local-dev-only 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=rag
      - POSTGRES_PASSWORD=local-dev-only
      - POSTGRES_DB=rag
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    # MinIO no longer publishes its own images to a public registry; this is a maintained
    # community build of the same server, pinned to a release.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=rag-local
      - MINIO_ROOT_PASSWORD=local-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  qdrant-data:
  opensearch-data:
  neo4j-data:
  postgres-data:
  minio-data:
